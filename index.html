<meta charset="utf-8">
<title>히든페이지 스튜디오</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --green:#2D4A3E; --green-deep:#1E332B; --yellow:#F6DE4A;
    --ink:#191F28; --sub:#4E5968; --mute:#B4BBC3;
    --line:#F2F4F6; --edge:#E5E8EB; --card:#F9FAFB; --chip:#F2F4F6; --paper:#FFFFFF;
    --r:16px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:14px;
    -webkit-font-smoothing:antialiased}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:20px;padding:18px 26px;flex-wrap:wrap}
  .steps{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
  .step{display:flex;align-items:center;gap:11px;border:none;background:transparent;
    padding:8px 12px;border-radius:12px;cursor:pointer;font-family:inherit;text-align:left}
  .step:hover{background:var(--chip)}
  .step i{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--chip);
    color:var(--mute);font-style:normal;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center}
  .step b{display:block;font-size:13.5px;font-weight:700;color:var(--mute);letter-spacing:-.02em}
  .step span{display:block;font-size:11.5px;color:var(--mute);margin-top:1px}
  .step.on i{background:var(--green);color:#fff}
  .step.on b{color:var(--ink)}
  .step.on span{color:var(--sub)}
  .step.done i{background:#DCE5E1;color:var(--green)}
  .step.done b{color:var(--sub)}
  .stepline{width:34px;height:1px;background:var(--edge);flex:0 0 auto}
  .topact{display:flex;align-items:center;gap:8px}
  button.big{padding:14px 26px;font-size:14.5px;font-weight:700;border-radius:14px}
  button.danger:hover{border-color:#DE4F3C;color:#DE4F3C;background:#FDECE9}
  button.off{background:var(--chip);border-color:transparent;color:var(--mute)}
  button.off:hover{background:var(--chip);border-color:transparent;color:var(--mute);
    cursor:not-allowed}
  button.danger.armed{background:#DE4F3C;border-color:#DE4F3C;color:#fff}
  button.danger.armed:hover{background:#C63E2C;color:#fff}

  /* ---------- layout ---------- */
  .main{display:grid;grid-template-columns:var(--panelw,460px) 10px 1fr;gap:8px;
    padding:0 26px 26px;align-items:start}
  .grip{height:calc(100vh - 116px);display:flex;align-items:center;justify-content:center;
    cursor:col-resize;border-radius:6px}
  .grip::before{content:"";width:3px;height:44px;border-radius:3px;background:var(--edge)}
  .grip:hover::before,.grip.on::before{background:var(--green)}
  .panel{background:var(--paper);border:1px solid var(--edge);border-radius:var(--r);
    display:flex;flex-direction:column;height:calc(100vh - 116px)}
  .panehead{display:flex;align-items:flex-start;gap:8px;padding:20px 22px 16px;
    border-bottom:1px solid var(--line);background:var(--paper);
    border-radius:var(--r) var(--r) 0 0}
  .panehead .grow{flex:1;min-width:0}
  .panehead h2{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:-.03em}
  .panehead .lead{margin:0;font-size:12.5px;color:var(--mute)}
  .panebox{overflow-y:auto;padding:20px 22px 24px;flex:1}
  .pane{display:none}
  .pane.on{display:block;animation:fade .16s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .pane .lead{font-size:12.5px;color:var(--mute)}

  /* ---------- controls ---------- */
  label{display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin:0 0 6px}
  input[type=text],input[type=number],select,textarea{width:100%;padding:11px 13px;
    border:1px solid transparent;border-radius:11px;font-family:inherit;font-size:13.5px;
    background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--edge) inset}
  input::placeholder{color:var(--mute)}
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 2px var(--green) inset}
  select:disabled{background:var(--chip);color:var(--mute)}
  #histP1 option[value="__add__"]{font-weight:700;color:var(--green)}
  .field{margin-bottom:16px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .inline{display:flex;gap:6px;align-items:center}
  .inline input,.inline select{flex:1;min-width:0}
  .subcard{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:15px;margin-bottom:16px}

  button{font-family:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--edge);
    background:#fff;padding:10px 16px;font-size:12.5px;font-weight:600;color:var(--sub);
    transition:.14s ease;white-space:nowrap}
  button:hover{border-color:var(--green);color:var(--green)}
  button.solid{background:var(--green);border-color:var(--green);color:#fff}
  button.solid:hover{background:var(--green-deep);color:#fff}
  button.mini{padding:10px 14px;flex:0 0 auto}
  button.wide{width:100%;padding:12px 16px}
  button.ghost{border-color:transparent;background:var(--chip);color:var(--mute)}
  button.ghost:hover{color:#DE4F3C;background:#FDECE9}
  button.dashed{border-style:dashed;border-color:var(--edge);color:var(--sub);border-radius:12px}
  button.dashed:hover{border-color:var(--green);color:var(--green)}
  button.start{background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:14px;padding:17px 16px;font-size:14px;font-weight:700}
  button.start:hover{background:#EFF4F2;border-color:var(--green);color:var(--green)}
  button.selectlike{width:100%;display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 18px;
    font-size:14px;font-weight:700;color:var(--ink)}
  button.selectlike:hover{border-color:var(--green);color:var(--green)}
  button.selectlike i{font-style:normal;font-size:15px;line-height:1;color:var(--sub);
    transition:transform .16s ease}
  button.selectlike.on{border-color:var(--green);color:var(--green)}
  button.selectlike.on i{transform:rotate(180deg);color:var(--green)}
  button.link{border:none;background:none;padding:0;color:var(--mute);font-size:11.5px}
  button.link:hover{color:var(--green)}
  button:disabled{opacity:.42;cursor:not-allowed}
  button:disabled:hover{border-color:var(--edge);color:var(--sub)}
  button.path{width:100%;margin-top:8px;background:var(--chip);border-color:transparent;
    font-size:11.5px;color:var(--sub);border-radius:11px;padding:10px 12px}
  button.path:hover{background:var(--green);color:#fff}
  .prow{margin-top:10px}
  .prow.one{grid-template-columns:1fr}

  /* ---------- history cards ---------- */
  .hcard{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--edge);
    border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer;transition:.14s}
  .hcard:hover{border-color:var(--green);background:#FAFCFB}
  .hcard .thumb{flex:0 0 auto;width:46px;height:57px;border-radius:7px;overflow:hidden;
    background:var(--chip);display:flex;align-items:center;justify-content:center}
  .hcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .hcard .thumb span{font-size:9px;color:var(--mute)}
  .hcard .meta{flex:1;min-width:0}
  .hcard .meta b{display:block;font-size:13px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hcard .meta span{font-size:11.5px;color:var(--mute)}
  .hcard .go{color:var(--mute);font-size:15px}
  .hbox{border:1px solid var(--line);border-radius:14px;background:var(--card);
    padding:12px;margin-top:8px}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  #histSearch{margin-bottom:10px;box-shadow:0 0 0 1px var(--edge) inset}
  #histList{max-height:300px;overflow-y:auto;padding-right:4px}
  .hcard.draft{border-style:dashed}
  .hcard .tag{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--green);
    background:#E7EFEB;border-radius:999px;padding:3px 8px}
  .hbox .head b{font-size:13px;font-weight:700}
  .or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--mute);font-size:11.5px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

  .drop{border:1.5px dashed var(--edge);border-radius:12px;padding:22px 14px;text-align:center;
    cursor:pointer;font-size:12.5px;color:var(--mute);background:#fff}
  .drop:hover{border-color:var(--green);color:var(--green)}
  .drop.has{padding:8px;border-style:solid;border-color:var(--edge)}
  .drop.has img{display:block;width:auto;max-width:100%;height:150px;margin:0 auto;
    object-fit:contain;border-radius:8px}
  #cCrop{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--edge);
    cursor:grab;background:var(--chip);touch-action:none}
  #cCrop:active{cursor:grabbing}
  #cropBox input[type=range]{width:100%;margin:12px 0 10px;accent-color:var(--green)}
  #dropLogo{background:var(--green);display:flex;align-items:center;justify-content:center;
    padding:16px;border:none;border-radius:12px;cursor:pointer}
  #dropLogo img{height:34px;width:auto;object-fit:contain}

  .opt{border:1px solid var(--edge);border-radius:13px;padding:16px;margin-bottom:10px;background:#fff}
  .opt header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .opt header b{font-size:12.5px;color:var(--ink);display:flex;align-items:center}
  .rate{display:inline-block;background:var(--green);color:#fff;border-radius:999px;
    padding:3px 10px;font-size:11px;font-weight:700;margin-left:7px}

  details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;
    font-size:13px;font-weight:700;color:var(--ink)}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::after{content:"▾";margin-left:auto;color:var(--mute);font-size:11px}
  details.fold[open]>summary::after{content:"▴"}
  details.fold[open]>summary{margin-bottom:16px}
  details.fold{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}

  .hint{font-size:11.5px;color:var(--mute);line-height:1.7;margin:8px 0 0}
  .hint.on{color:#DE4F3C}

  /* ---------- preview ---------- */
  .preview{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:18px 20px;height:calc(100vh - 116px);overflow:auto}
  .pvhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .pvhead>span{font-size:12.5px;font-weight:700;color:var(--sub)}
  .zoombar{display:flex;align-items:center;gap:6px}
  .zoombar button{padding:7px 12px;background:#fff}
  .zoombar #zoomVal{width:62px;padding:7px 6px;text-align:center;font-size:12px;font-weight:700;
    border-radius:9px;background:#fff}
  .canvases{display:flex;gap:18px;align-items:flex-start;flex-wrap:nowrap}
  .frame{flex:0 0 auto}
  .frame canvas{display:block;background:#fff;border-radius:6px;
    box-shadow:0 2px 16px rgba(25,31,40,.09)}
  .frame p{margin:9px 0 0;font-size:10.5px;font-weight:700;letter-spacing:.08em;
    color:var(--mute);text-align:center}
</style>

<div class="topbar">
  <div class="steps">
    <button class="step on" data-step="1"><i>1</i><div><b>제품 선택</b><span>불러오거나 새로 시작해주세요</span></div></button>
    <div class="stepline"></div>
    <button class="step" data-step="2"><i>2</i><div><b>썸네일</b><span>썸네일 문구와 이미지를 입력해주세요</span></div></button>
    <div class="stepline"></div>
    <button class="step" data-step="3"><i>3</i><div><b>상세 · 옵션</b><span>상품 옵션과 가격 정보를 입력해주세요</span></div></button>
  </div>
  <div class="topact">
    <button id="btnDel" class="big danger">삭제하기</button>
    <button id="dlBoth" class="solid big">최종본 출력</button>
  </div>
</div>

<div class="main">
  <div class="panel">
    <div class="panehead">
      <div class="grow">
        <h2 id="paneTitle">1. 제품 선택</h2>
        <p class="lead" id="paneLead">히스토리에서 불러오거나, 새로 시작해주세요.</p>
        <p class="hint" id="lockMsg" style="margin:2px 0 0"></p>
      </div>
      <button id="prevStep">← 이전</button>
      <button id="t1Save">저장</button>
      <button id="nextStep">다음 →</button>
      <button id="histSave" hidden></button>
    </div>
    <div class="panebox">

      <!-- ===== STEP 1 ===== -->
      <div class="pane on" data-pane="1">
        <div class="field">
          <div class="head"><label style="margin:0">히스토리</label>
            <button id="pEdit" class="link">이름 수정</button></div>
          <button id="histToggle" class="selectlike">저장된 작업 불러오기<i>▾</i></button>
          <div id="histPanel" class="hbox" hidden>
            <input type="text" id="histSearch" placeholder="제품명 검색">
            <div id="histList"></div>
          </div>
        </div>

        <select id="histP1" hidden></select>

        <div id="pPanel" class="subcard" hidden>
          <div class="field"><label id="pLabel">제품명</label>
            <input type="text" id="pName" placeholder="제품명을 입력하세요"></div>
          <button id="pPrimary" class="wide">이름 변경</button>
          <div class="row prow" id="pRow2"><button id="pDel" class="ghost">목록에서 삭제</button>
            <button id="pCancel">취소</button></div>
          <p class="hint" id="pHint"></p>
        </div>

        <div class="or">또는</div>
        <button id="histNew" class="wide start">＋ 새로 시작하기</button>
        <p class="hint">이전에 만든 건 위 목록에서, 신규는 새로 시작하기로 진행하세요.</p>

        <p class="hint" id="histNote"></p>
        <p class="hint" id="connNote"></p>
      </div>

      <!-- ===== STEP 2 ===== -->
      <div class="pane" data-pane="2">
        <div class="field"><label>메인타이틀 1행 (Bold 54)</label>
          <input type="text" id="t1" placeholder="제품명"></div>
        <div class="field"><label>메인타이틀 2행 (Bold 54 · 브랜드 그린)</label>
          <input type="text" id="t2" placeholder="시크릿 특가"></div>
        <div class="field"><label>서브타이틀 앞부분 (Regular 22)</label>
          <input type="text" id="sub" placeholder="오직 여기서만, 제품명"></div>

        <div class="field"><label>연출컷 528×400 · 드래그로 위치, 슬라이더로 확대</label>
          <div class="drop" id="dropThumb">클릭해서 이미지 선택</div>
          <div id="cropBox" hidden>
            <canvas id="cCrop" width="348" height="264"></canvas>
            <input type="range" id="zoom" min="100" max="280" value="100">
            <div class="row"><button id="cropReset">가운데 정렬</button><button id="cropChange">이미지 변경</button></div>
          </div>
          <button class="path" data-copypath="1">이미지 경로 복사</button></div>

        <p class="hint">서브타이틀 끝의 <b>UP TO 00%</b>는 옵션 중 최대 할인율로 자동 입력됩니다.</p>
      </div>

      <!-- ===== STEP 3 ===== -->
      <div class="pane" data-pane="3">
        <p class="lead" style="margin:0 0 10px">옵션 <b id="optCount"></b></p>
        <div id="opts"></div>
        <button id="addOpt" class="wide dashed">＋ 옵션 추가</button>
        <p class="hint">텍스트 칸은 비워두면 회색 예시값이 들어갑니다. <b>가격 3칸</b>을 채워야 JPG로 출력됩니다.</p>

        <details class="fold">
          <summary>상단 고정 안내 문구</summary>
          <div>
            <div class="field"><label>상단 라벨</label><input type="text" id="g0" placeholder="주의"></div>
            <div class="field"><label>헤드라인 1행</label><input type="text" id="g1" placeholder="이 페이지를 나가면"></div>
            <div class="field"><label>헤드라인 2행 (옐로우)</label><input type="text" id="g2" placeholder="할인이 불가능합니다."></div>
            <div class="field"><label>설명 1행</label><input type="text" id="g3" placeholder="비정상적가격 할인행사 시 재판매유통 피해를 막기 위해"></div>
            <div class="field"><label>설명 2행</label><input type="text" id="g4" placeholder="본 링크에서만 할인가 구매가 가능합니다."></div>
            <div class="field"><label>NOTICE 1행</label><input type="text" id="g5" placeholder="링크 저장 없이 페이지 이탈 시 재접속이 불가하오니 참고바랍니다."></div>
            <div class="field"><label>NOTICE 2행</label><input type="text" id="g6" placeholder="국내 및 해외 모든 판매처중 가장 압도적인 혜택이 적용되어 있습니다."></div>
            <div class="field"><label>브랜드 로고 이미지 (클릭해서 교체)</label>
              <div class="drop has" id="dropLogo"></div></div>
            <div class="row">
              <div class="field"><label>섹션 타이틀</label><input type="text" id="g8" placeholder="비밀링크 할인가 안내"></div>
              <div class="field"><label>섹션 설명</label><input type="text" id="g9" placeholder="이 페이지에서만 할인가로 구매할 수 있습니다."></div>
            </div>
          </div>
        </details>
      </div>

    </div>
  </div>

  <div class="grip" id="grip" title="드래그해서 폭 조절"></div>

  <div class="preview" id="stage">
    <div class="pvhead">
      <span>미리보기</span>
      <div class="zoombar">
        <button id="zoomOut">−</button><input type="text" id="zoomVal" value="100%"><button id="zoomIn">＋</button>
        <button id="zoomFit">화면 맞춤</button>
      </div>
    </div>
    <input type="range" id="pvZoom" min="15" max="100" value="40" hidden>
    <div class="canvases">
      <div class="frame" id="fT"><canvas id="cT" width="528" height="659"></canvas>
        <p>썸네일 528 × 659</p></div>
      <div class="frame" id="fD"><canvas id="cD" width="860" height="2440"></canvas>
        <p>상세 860 × <span id="dh">2440</span></p></div>
    </div>
  </div>
</div>

<script>
const NAS_PATH='\\\\DESKTOP-3NFDED0\\Design Team\\02.썸네일&상세페이지';
const T_GRAD=['#111111','#3E7A6C'];   // 썸네일 1행 그라데이션 (고정)
const GREEN='#183B35', YELLOW='#F6DE4A', INK='#141414', PAPER='#FAFAFA';
const RULE_W=3, RULE_COLOR='#111111', RULE_EXT=5;   // 구분선만 좌우 5px씩(도합 10px) 확장

function missingAll(){

}

/* ---------- canvas helpers ---------- */
function f(size,weight){return `${weight} ${size}px Pretendard, sans-serif`;}
function txt(_,c,t,x0,y,{size=20,weight=400,color=INK,align='left',ls=0}={}){
  c.font=f(size,weight); c.fillStyle=color; c.textBaseline='middle';
  if(!ls){ c.textAlign=align; c.fillText(t,x0,y); c.textAlign='left'; return; }
  c.textAlign='left';
  const w=[...t].reduce((s,ch)=>s+c.measureText(ch).width+ls,0)-ls;
  let cx = align==='center'? x0-w/2 : align==='right'? x0-w : x0;
  for(const ch of t){ c.fillText(ch,cx,y); cx+=c.measureText(ch).width+ls; }
}
function width(c,t,size,weight,ls=0){
  c.font=f(size,weight);
  return ls? [...t].reduce((s,ch)=>s+c.measureText(ch).width+ls,0)-ls : c.measureText(t).width;
}
function drawCrop(c,img,X,Y,W,H,cr){
  if(!img){ c.fillStyle='#ECEFEE'; c.fillRect(X,Y,W,H);
    txt(0,c,'이미지 없음',X+W/2,Y+H/2,{size:16,color:'#A9B4B2',align:'center'}); return; }
  const s=Math.max(W/img.width,H/img.height)*cr.zoom, dw=img.width*s, dh=img.height*s;
  c.save(); c.beginPath(); c.rect(X,Y,W,H); c.clip();
  c.drawImage(img, X+(W-dw)*cr.x, Y+(H-dh)*cr.y, dw, dh); c.restore();
}
function cover(c,img,x,y,w,h){
  if(!img){ c.fillStyle='#ECEFEE'; c.fillRect(x,y,w,h);
    txt(0,c,'이미지 없음',x+w/2,y+h/2,{size:16,color:'#A9B4B2',align:'center'}); return; }
  const s=Math.max(w/img.width,h/img.height), dw=img.width*s, dh=img.height*s;
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh); c.restore();
}
function priceRow(c,y,label,value,{lc,vc,vs,vw,ls_=false}){
  txt(0,c,label,M,y,{size:22,weight:ls_?700:300,color:lc});
  const uw=width(c,'원',18,300);
  txt(0,c,'원',TEXT_R,y+4,{size:18,weight:300,color:lc,align:'right'});
  txt(0,c,won(value),TEXT_R-uw-4,y,{size:vs,weight:vw,color:vc,align:'right'});
}

  grad.addColorStop(0,T_GRAD[0]); grad.addColorStop(1,T_GRAD[1]);
  txt(0,c,g1t,264,97,{size:54,weight:700,color:grad,align:'center'});
  txt(0,c,V('t2'),264,159,{size:54,weight:700,color:GREEN,align:'center'});

}

function drawBlock(c,o,i,T){
  const numStr=String(i+1).padStart(2,'0');
  const eb='Option '+numStr, x1=M+width(c,eb,22,500)+14;
  txt(0,c,eb,M,T+25,{size:22,weight:400,color:'#aaaaaa'});
  c.fillStyle='#D8DDDC'; c.fillRect(x1,T+14,1,24);
  const nm=F(o,'name');
  txt(0,c,nm,x1+14,T+25,{size:22,weight:500,color:'#3C4442'});
  if(o.tag.trim()){
    const x2=x1+14+width(c,nm,22,500)+14;
    c.fillStyle='#D8DDDC'; c.fillRect(x2,T+14,1,24);
    txt(0,c,o.tag.trim(),x2+14,T+25,{size:22,weight:500,color:'#3C4442'});
  }
  c.fillStyle='#DFE3E2'; c.fillRect(M,T+56,TEXT_R-M,1);

  txt(0,c,F(o,'l1'),M,T+102,{size:32,weight:700,color:'#1B1B1B'});
  txt(0,c,F(o,'l2'),M,T+158,{size:32,weight:700,color:'#1B1B1B'});

  c.beginPath(); c.arc(420,T+143,38,0,7); c.fillStyle=GREEN; c.fill();
  txt(0,c,rate(o)+'%',420,T+143,{size:26,weight:700,color:'#fff',align:'center'});

  priceRow(c,T+247,'정상가',num(o.normal),{lc:'#aaaaaa',vc:'#aaaaaa',vs:28,vw:500});
  priceRow(c,T+289,'할인가',num(o.sale),{lc:'#333333',vc:'#333333',vs:28,vw:700});
  priceRow(c,T+346,'비밀 할인가',num(o.secret),{lc:GREEN,vc:GREEN,vs:40,vw:700,ls_:true});

  cover(c,o.img,IMG_X,T+10,IMG_W,IMG_H);
}

        <div class="field"><label>할인가</label><input type="number" data-k="sale" data-i="${i}" value="${o.sale}" placeholder="${PH.sale}"></div>

function loadImg(file,cb){
  const r=new FileReader();
  r.onload=e=>{const im=new Image(); im.onload=()=>cb(im); im.src=e.target.result;};
  r.readAsDataURL(file);
}
function pick(cb){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>inp.files[0]&&loadImg(inp.files[0],cb); inp.click();
}
document.addEventListener('input',e=>{
  const i=e.target.dataset.i;
  if(i!==undefined){
    const k=e.target.dataset.k;
    opts[i][k]=e.target.value;
    if(['normal','secret'].includes(k)){
      const b=document.querySelectorAll('.opt .rate')[i]; if(b) b.textContent=rate(opts[i])+'%';
    }
  }
  draw();
});
document.addEventListener('click',e=>{
  if(e.target.dataset.copypath){ copyText(NAS_PATH,e.target); return; }
  const card=e.target.closest('[data-load]');
  if(card){ const id=card.dataset.load;
    fillProducts(id); $('histP1').value=id; applyProductPlaceholders();
    openHist(false); loadSaved(id).then(()=>goStep(2)); return; }
  const d=e.target.closest('[data-drop]');
  if(d){ const i=+d.dataset.drop;
    pick(im=>normalize(im,IMG_W,IMG_H,n=>{opts[i].img=n; renderOpts(); draw();})); return; }
  const del=e.target.dataset.del;
  if(del!==undefined){ opts.splice(+del,1); renderOpts(); draw(); }
});
$('addOpt').onclick=()=>{
  if(opts.length>=3) return;
  opts.push(blank());
  renderOpts(); draw();
};
$('dropLogo').onclick=()=>pick(im=>{ logoImg=im;
  $('dropLogo').innerHTML='<img src="'+im.src+'">'; draw(); });
$('dropThumb').onclick=pickThumb;

/* ---------- 이미지 정규화: 슬롯 규격 2배로 미리 크롭·압축 ---------- */
function normalize(img,w,h,cb){
  const s=2, cv=document.createElement('canvas'); cv.width=w*s; cv.height=h*s;
  const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height);
  cover(c,img,0,0,cv.width,cv.height);
  const out=new Image(); out.onload=()=>cb(out); out.src=cv.toDataURL('image/jpeg',0.9);
}
function downscale(img,max,cb){
  const s=Math.min(1,max/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');
  cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  const out=new Image(); out.onload=()=>cb(out); out.src=cv.toDataURL('image/jpeg',0.92);
}
function setThumbPreview(){
  const has=!!thumbImg;
  $('dropThumb').hidden=has; $('cropBox').hidden=!has;
  $('zoom').value=Math.round(thumbCrop.zoom*100);
  drawCropPreview();
}
function drawCropPreview(){
  const cv=$('cCrop'), c=cv.getContext('2d'), k=cv.width/528;
  c.clearRect(0,0,cv.width,cv.height);
  c.save(); c.scale(k,k); drawCrop(c,thumbImg,0,0,528,400,thumbCrop); c.restore();
}
function pickThumb(){   // 연출컷 원본은 긴 변 1800px 로 줄여 보관
  pick(im=>downscale(im,1800,n=>{ thumbImg=n; thumbCrop={zoom:1,x:.5,y:.5}; setThumbPreview(); draw(); }));
}
/* 드래그로 위치 조절 */
function initCropDrag(){
  const cv=$('cCrop'); let drag=null;
  const pt=e=>e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};
  const start=e=>{ if(thumbImg){ drag=pt(e); e.preventDefault(); } };
  const move=e=>{
    if(!drag||!thumbImg) return;
    const p=pt(e), k=cv.width/528;
    const s=Math.max(528/thumbImg.width,400/thumbImg.height)*thumbCrop.zoom;
    const ovX=thumbImg.width*s-528, ovY=thumbImg.height*s-400;
    const cl=v=>Math.min(1,Math.max(0,v));
    if(ovX>0.5) thumbCrop.x=cl(thumbCrop.x-(p.x-drag.x)/k/ovX);
    if(ovY>0.5) thumbCrop.y=cl(thumbCrop.y-(p.y-drag.y)/k/ovY);
    drag=p; drawCropPreview(); drawThumb(); e.preventDefault();
  };
  const end=()=>{ drag=null; };
  cv.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false});
  cv.addEventListener('touchmove',move,{passive:false});
  cv.addEventListener('touchend',end);
  $('zoom').addEventListener('input',()=>{ thumbCrop.zoom=+$('zoom').value/100; drawCropPreview(); drawThumb(); });
  $('cropReset').onclick=()=>{ thumbCrop={zoom:1,x:.5,y:.5}; setThumbPreview(); draw(); };
  $('cropChange').onclick=pickThumb;
}

/* 업로드한 이미지의 data URL ↔ 드라이브 파일ID 대응.
   불러온 뒤 그대로 저장하면 재업로드 없이 기존 파일을 재사용합니다. */
const IMG_ID=new Map();

/* 드라이브 이미지 캐시 (IndexedDB) — 두 번째 불러오기부터는 서버를 거치지 않습니다 */
const Cache=(()=>{
  let db=null;
  const open=()=>new Promise(res=>{
    if(db) return res(db);
    try{
      const r=indexedDB.open('hps-img',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('img');
      r.onsuccess=()=>{ db=r.result; res(db); };
      r.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
  const tx=async(mode,fn)=>{
    const d=await open(); if(!d) return null;
    return new Promise(res=>{
      const t=d.transaction('img',mode), s=t.objectStore('img'), q=fn(s);
      q.onsuccess=()=>res(q.result); q.onerror=()=>res(null);
    });
  };
  return {
    get:id=>tx('readonly',s=>s.get(id)),
    set:(id,v)=>tx('readwrite',s=>s.put(v,id))
  };
})();

async function api(payload){
  const ac=new AbortController();
  const timer=setTimeout(()=>ac.abort(),45000);          // 응답이 없으면 45초 뒤 중단
  let r;
  try{
    r=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // 사전요청(OPTIONS) 회피
      body:JSON.stringify(Object.assign({token:API_TOKEN},payload)),
      signal:ac.signal
    });
  }catch(e){
    throw new Error(e.name==='AbortError' ? '서버 응답이 없습니다 (시간 초과)' : e.message);
  }finally{ clearTimeout(timer); }
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'API_ERROR');
  return j;
}

/* data URL → 드라이브 파일ID (이미 올린 이미지는 건너뜀) */
async function toFileId(dataUrl,label){
  if(!dataUrl) return null;
  if(IMG_ID.has(dataUrl)) return IMG_ID.get(dataUrl);
  const {id}=await api({action:'upload',name:label,data:dataUrl});
  IMG_ID.set(dataUrl,id);
  return id;
}
/* 드라이브 파일ID → data URL (캐시 우선) */
async function toDataUrl(id){
  if(!id) return null;
  const hit=await Cache.get(id);
  if(hit){ IMG_ID.set(hit,id); return hit; }
  const {data}=await api({action:'image',id});
  await Cache.set(id,data);
  IMG_ID.set(data,id);
  return data;
}

const Store = {
  mode: API_URL ? 'sheet' : (LS ? 'local' : 'memory'),

  /* --- 목록(가벼운 메타) --- */
  async list(){
    if(this.mode==='sheet') return (await api({action:'list'})).rows;
    return this._all().map(x=>({id:x.id,name:x.name,date:x.date,ts:x.ts,
                                preview:(x.data&&x.data.preview)||''}));
  },

  /* --- 제품 1건 전체 --- */
  async get(id){
    if(this.mode!=='sheet') return this._all().find(x=>x.id===id)||null;
    const {row}=await api({action:'get',productId:id});
    if(!row) return null;
    const data=JSON.parse(row.payload||'{}');
    if(data.thumb) data.thumb=await toDataUrl(data.thumb);
    for(const o of (data.opts||[])) if(o.img) o.img=await toDataUrl(o.img);
    return {id:row.id,name:row.name,date:row.date,ts:Date.parse(row.date.replace(/\./g,'-'))||0,data};
  },

  /* --- 저장 --- */
  async put(item){
    if(this.mode!=='sheet'){
      const list=this._all(), i=list.findIndex(x=>x.id===item.id);
      if(i>=0) list[i]=item; else list.push(item);
      return this._write(list);
    }
    const d=JSON.parse(JSON.stringify(item.data)), ids=[];
    if(d.preview){ d.preview=await toFileId(d.preview,item.name+'_pv'); ids.push(d.preview); }
    if(d.thumb){ d.thumb=await toFileId(d.thumb,item.name+'_thumb'); ids.push(d.thumb); }
    for(let i=0;i<(d.opts||[]).length;i++){
      if(d.opts[i].img){ d.opts[i].img=await toFileId(d.opts[i].img,item.name+'_opt'+(i+1)); ids.push(d.opts[i].img); }
    }
    await api({action:'save',productId:item.id,productName:item.name,
               payload:JSON.stringify(d),images:ids,preview:d.preview||'',user:item.user||''});
    return true;
  },

  async del(id){
    if(this.mode==='sheet'){ await api({action:'delete',productId:id}); return true; }
    return this._write(this._all().filter(x=>x.id!==id));
  },

  /* --- 제품 목록 --- */
  async getProducts(){
    if(this.mode==='sheet'){
      const {products}=await api({action:'products'});
      return products.length?products:null;
    }
    if(!LS) return MEMP;
    try{ return JSON.parse(LS.getItem(PKEY)); }catch(e){ return null; }
  },
  async setProducts(list){
    if(this.mode==='sheet'){ await api({action:'saveProducts',products:list}); return; }
    if(!LS){ MEMP=list; return; }
    try{ LS.setItem(PKEY,JSON.stringify(list)); }catch(e){}
  },

  /* --- 로컬 전용 --- */
  _all(){
    if(!LS) return MEM;
    try{ return JSON.parse(LS.getItem(HKEY))||[]; }catch(e){ return []; }
  },
  _write(list){
    if(!LS){ MEM=list; return true; }
    for(let i=0;i<8;i++){
      try{ LS.setItem(HKEY,JSON.stringify(list)); return true; }
      catch(e){ if(list.length>1) list.shift(); else return false; }
    }
    return false;
  }
};

function ago(ts){
  if(!ts) return '시각 미상';
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return '방금 전';
  if(m<60) return m+'분 전';
  const hr=Math.floor(m/60);
  if(hr<24) return hr+'시간 전';
  const d=Math.floor(hr/24);
  return d<30 ? d+'일 전' : Math.floor(d/30)+'개월 전';
}
function stamp(){ const d=new Date(), z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'.'+z(d.getMonth()+1)+'.'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes()); }

function previewShot(){            // 히스토리 카드에 쓸 작은 썸네일 렌더
  try{
    const w=132,ht=165,cv=document.createElement('canvas');
    cv.width=w; cv.height=ht;
    const c=cv.getContext('2d');
    c.fillStyle='#fff'; c.fillRect(0,0,w,ht);
    c.drawImage($('cT'),0,0,w,ht);
    return cv.toDataURL('image/jpeg',0.7);
  }catch(e){ return null; }
}
function snapshot(){
  const s={fields:{},opts:[],preview:previewShot(),thumb:thumbImg?thumbImg.src:null,crop:Object.assign({},thumbCrop),
           logo:(logoImg&&logoImg.src!==LOGO_SRC)?logoImg.src:null};
  GIDS.forEach(id=>s.fields[id]=$(id).value);
  s.opts=opts.map(o=>({name:o.name,tag:o.tag,l1:o.l1,l2:o.l2,
                       normal:o.normal,sale:o.sale,secret:o.secret,img:o.img?o.img.src:null}));
  return s;
}
function restore(s){
  GIDS.forEach(id=>{ if(s.fields&&s.fields[id]!==undefined) $(id).value=s.fields[id]; });
  opts=(s.opts||[blank()]).map(o=>{
    const n=Object.assign(blank(),o); n.img=null;
    if(o.img){ const im=new Image(); im.onload=draw; im.src=o.img; n.img=im; }
    return n;
  });
  thumbCrop = s.crop ? Object.assign({zoom:1,x:.5,y:.5},s.crop) : {zoom:1,x:.5,y:.5};
  if(s.thumb){ const im=new Image(); im.onload=()=>{thumbImg=im; setThumbPreview(); draw();}; im.src=s.thumb; }
  else { thumbImg=null; setThumbPreview(); }
  if(s.logo){ const im=new Image(); im.onload=()=>{logoImg=im; $('dropLogo').innerHTML='<img src="'+im.src+'">'; draw();}; im.src=s.logo; }
  renderOpts(); draw();
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function setConn(msg,bad){
  const el=$('connNote'); if(!el) return;
  el.textContent=msg; el.style.color = bad ? '#DE4F3C' : '';
}

const SAVED=new Map();                 // 제품ID → 저장 메타
function fillProducts(keepId){
  const sel=$('histP1'), prev=keepId||sel.value;
  const opt=p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>';
  const done=PRODUCTS.filter(p=>SAVED.has(p.id));
  // 아직 저장 전인 작업만 따로 노출 — 미저장 제품 전체는 목록에 쌓지 않습니다
  const draft=PRODUCTS.filter(p=>!SAVED.has(p.id) && p.id===prev);
  sel.innerHTML='<option value="">제품 선택</option><option value="__add__">＋ 제품 추가</option>'
    +(draft.length?'<optgroup label="작업 중">'+draft.map(opt).join('')+'</optgroup>':'')
    +(done.length?'<optgroup label="저장된 작업">'+done.map(opt).join('')+'</optgroup>':'');
  if(prev && PRODUCTS.some(p=>p.id===prev)) sel.value=prev;
}

async function initProducts(){
  setConn(Store.mode==='sheet' ? '구글시트에 연결 중…' : '이 브라우저에만 저장됩니다 (시트 미연결)');
  let saved=null;
  try{
    saved=await Store.getProducts();
    if(Store.mode==='sheet') setConn('구글시트 연결됨 · 팀원과 기록이 공유됩니다');
  }catch(e){
    setConn('시트 연결 실패: '+e.message+' — 가이드의 문제 해결을 확인하세요',true);
  }
  if(Array.isArray(saved)&&saved.length){
    PRODUCTS=saved.map(x=> typeof x==='string' ? {id:newPid(),name:x} : x);
  }else{
    try{ await Store.setProducts(PRODUCTS); }catch(e){}   // 최초 1회만 기본 목록을 심습니다
  }
  fillProducts();

  let pMode='edit', pOrigin='';
  function syncPrimary(){
    const v=$('pName').value.trim();
    const changed = pMode==='add' ? !!v : (!!v && v!==pOrigin);
    $('pPrimary').classList.toggle('solid',changed);
  }
  function openPanel(mode){
    pMode=mode; $('pPanel').hidden=false;
    const add = mode==='add';
    pOrigin = add ? '' : curName();
    $('pPrimary').textContent = add ? '제품 추가' : '이름 변경';
    $('pDel').hidden = add; $('pRow2').classList.toggle('one',add);
    $('pLabel').textContent = add ? '추가할 제품명' : '제품명';
    $('pHint').textContent = add ? '단품·세트 구성 모두 이름으로 구분해 등록하세요.'
                                 : '이름을 바꾸면 저장된 기록의 이름도 함께 바뀝니다.';
    $('pName').value = pOrigin; syncPrimary(); $('pName').focus();
  }
  function closePanel(){ $('pPanel').hidden=true; }

  $('pName').addEventListener('input',syncPrimary);
  $('pPrimary').onclick=()=>{ pMode==='add' ? doAdd() : doRename(); };
  $('pCancel').onclick=closePanel;
  $('histNew').onclick=()=>{                 // 신규 작업은 제품명을 먼저 정하고 시작합니다
    $('histP1').value=''; applyProductPlaceholders(); resetWork();
    openPanel('add'); renderHist();
  };
  $('pEdit').onclick=()=>{
    if($('pPanel').hidden===false){ closePanel(); return; }
    if(!curId()){ alert('수정할 제품을 먼저 선택해 주세요.'); return; }
    openPanel('edit');
  };
  $('histP1').addEventListener('change',()=>{
    if($('histP1').value==='__add__'){ $('histP1').value=''; openPanel('add'); return; }
    closePanel();                       // 제품을 고르는 것만으로는 패널이 열리지 않습니다
    applyProductPlaceholders();
    loadSaved(curId());
  });

  async function doRename(){
    const id=curId(), oldN=curName(), newN=$('pName').value.trim();
    if(!id){ alert('바꿀 제품을 먼저 선택해 주세요.'); return; }
    if(!newN || newN===oldN) return;
    if(PRODUCTS.some(p=>p.name===newN)){ alert('같은 이름의 제품이 이미 있습니다.'); return; }
    PRODUCTS.find(p=>p.id===id).name=newN;   // 연결 키는 제품ID 라 이름을 바꿔도 기록이 유지됩니다
    try{ await Store.setProducts(PRODUCTS); }
    catch(e){ alert('이름 변경에 실패했습니다.\n'+e.message); return; }
    fillProducts(id); closePanel(); applyProductPlaceholders(); renderHist();
  }
  async function doAdd(){
    const n=$('pName').value.trim();
    if(!n){ alert('추가할 제품명을 입력해 주세요.'); return; }

    // 같은 이름이 이미 있으면 새로 만들지 않고 그 제품을 그대로 씁니다
    let np=PRODUCTS.find(p=>p.name===n);
    const hadRecord = np && SAVED.has(np.id);
    if(!np){
      np={id:newPid(),name:n};
      PRODUCTS.push(np); PRODUCTS.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
      try{ await Store.setProducts(PRODUCTS); }
      catch(e){ alert('제품 추가에 실패했습니다.\n'+e.message); return; }
    }
    fillProducts(np.id); $('histP1').value=np.id;
    closePanel(); applyProductPlaceholders();

    if(hadRecord){                      // 저장된 기록이 있으면 새로 시작하지 않고 불러옵니다
      alert('"'+n+'" 은 저장된 작업이 있어 기존 내용을 불러옵니다.');
      await loadSaved(np.id); goStep(2);
    }else{
      resetWork(); $('t1').value=n; await renderHist(); draw(); goStep(2);
    }
  }
  async function delCurrent(){
    const id=curId();
    if(!id) return false;
    PRODUCTS=PRODUCTS.filter(p=>p.id!==id);
    try{ await Store.setProducts(PRODUCTS); await Store.del(id); }
    catch(e){ alert('삭제에 실패했습니다.\n'+e.message); return false; }
    fillProducts(); $('pName').value=''; closePanel();
    resetWork(); applyProductPlaceholders(); renderHist();
    return true;
  }
  $('pDel').onclick=async()=>{
    const id=curId(), n=curName();
    if(!id) return;
    if(!confirm('"'+n+'" 을 삭제할까요?\n제품 목록과 저장된 설정이 함께 지워집니다.')) return;
    await delCurrent();
  };

  /* 상단 삭제하기 — 한 번 누르면 빨갛게 바뀌고, 다시 누르면 삭제됩니다 */
  const del=$('btnDel'); let armTimer=null;
  const disarm=()=>{ del.classList.remove('armed'); del.textContent='삭제하기';
                     clearTimeout(armTimer); armTimer=null; };
  window.syncDel=()=>{                         // 선택된 제품이 없으면 회색으로 비활성 표시
    if(curId()) del.classList.remove('off');
    else { disarm(); del.classList.add('off'); }
  };
  del.onclick=async()=>{
    if(!curId()) return;                       // 회색 상태에서는 아무 동작도 하지 않습니다
    if(!del.classList.contains('armed')){
      del.classList.add('armed'); del.textContent='정말 삭제할까요?';
      armTimer=setTimeout(disarm,4000);          // 4초 안에 다시 누르지 않으면 취소
      return;
    }
    disarm();
    if(await delCurrent()) goStep(1);
  };
  $('histP1').addEventListener('change',()=>{ disarm(); syncDel(); });
  syncDel();
}

function resetWork(){                  // 텍스트·이미지·옵션을 전부 비웁니다 (제품 선택은 유지)
  GIDS.forEach(id=>$(id).value='');
  opts=[blank()];
  thumbImg=null; thumbCrop={zoom:1,x:.5,y:.5}; setThumbPreview();
  renderOpts(); draw();
}
async function loadSaved(id){
  if(!id){ renderHist(); return; }
  let it=null;
  try{ it=await Store.get(id); }
  catch(e){ setConn('불러오기 실패: '+e.message,true); }
  if(it) restore(it.data);
  else resetWork();                    // 저장 기록이 없으면 이전 제품의 이미지가 남지 않도록 초기화
  renderHist();
}

const PV=new Map();                 // 제품ID → 미리보기 data URL
function refreshDel(){ if(window.syncDel) window.syncDel(); }
async function drawHistCards(list){
  refreshDel();
  const box=$('histList');
  if(!box) return;
  const q=$('histSearch').value.trim().toLowerCase();
  const rows=list.slice().sort((a,b)=>(b.ts||0)-(a.ts||0));

  // 아직 저장 전인 작업도 카드로 보여줍니다
  const cur=curId();
  const draft = (cur && !SAVED.has(cur))
    ? [{id:cur,name:curName(),date:'저장 전',draft:true}] : [];

  const show=draft.concat(rows).filter(r=>!q || r.name.toLowerCase().includes(q));

  box.innerHTML = show.length ? show.map(r=>
      '<div class="hcard'+(r.draft?' draft':'')+'" data-load="'+esc(r.id)+'">'
      +'<div class="thumb">'+(PV.get(r.id)?'<img src="'+PV.get(r.id)+'">':'<span>없음</span>')+'</div>'
      +'<div class="meta"><b>'+esc(r.name)+'</b><span>'+esc(r.date||'')+'</span></div>'
      +(r.draft?'<div class="tag">작업 중</div>':'<div class="go">›</div>')+'</div>').join('')
    : '<p class="hint" style="margin:0">'
      +(q?'검색 결과가 없습니다.':'저장된 작업이 없습니다. 아래 새로 시작하기로 만들어 보세요.')+'</p>';

  for(const r of show){                       // 미리보기는 뒤에서 채워 넣습니다
    if(!r.preview || PV.has(r.id)) continue;
    try{
      const src = Store.mode==='sheet' ? await toDataUrl(r.preview) : r.preview;
      PV.set(r.id,src);
      const el=box.querySelector('[data-load="'+r.id+'"] .thumb');
      if(el) el.innerHTML='<img src="'+src+'">';
    }catch(e){}
  }
}
async function renderHist(){
  let list=[];
  try{ list=await Store.list(); }catch(e){ setConn('목록 조회 실패: '+e.message,true); }
  SAVED.clear(); list.forEach(x=>SAVED.set(x.id,x));
  fillProducts();
  drawHistCards(list);
  const cur=list.find(x=>x.id===curId());
  $('histNote').textContent = cur
    ? '최종 수정: '+cur.date+(cur.ts?' ('+ago(cur.ts)+')':'')
    : (Store.mode==='memory'
      ? '이 환경은 브라우저 저장이 막혀 있어 새로고침하면 사라집니다.'
      : '제품을 고르면 저장해둔 설정을 자동으로 불러옵니다.');
}
$('histSave').onclick=async()=>{
  const id=curId(), nm=curName();
  if(!id){ alert('제품을 먼저 선택해 주세요.'); return; }
  const dup=(await Store.list()).find(x=>x.id===id);
  if(dup && !confirm('"'+nm+'" 기록이 이미 있습니다.\n제품당 1건만 유지되므로 덮어씁니다. 계속할까요?')) return;
  await busy($('histSave'),'현재 설정 저장',async()=>{
    const ok=await Store.put({id,name:nm,date:stamp(),ts:Date.now(),data:snapshot()});
    if(!ok) alert('저장 공간이 부족합니다.');
    renderHist();
  });
};

function save(cv,name){ cv.toBlob(b=>{
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
},'image/jpeg',0.95); }

$('dlBoth').onclick=()=>{
  if(missingAll().length){ flagLock(); return; }
  save($('cT'),'thumbnail_528x659.jpg');
  setTimeout(()=>save($('cD'),'detail_860x'+detailHeight()+'.jpg'),350);
  setTimeout(()=>quickSave(true),700);      // 출력하면 히스토리에도 자동 저장
};

let LOCK_SHOWN=false;                 // 저장·출력을 눌러본 뒤에만 안내를 띄웁니다
function updateLock(){
  const m=missingAll();
  if(!m.length) LOCK_SHOWN=false;
  $('dlBoth').classList.toggle('off',m.length>0);
  const show=m.length&&LOCK_SHOWN;
  const head=m.slice(0,3).join(', ')+(m.length>3?' 외 '+(m.length-3)+'건':'');
  $('lockMsg').textContent = show ? head+'을(를) 입력해 주세요.' : '';
  $('lockMsg').classList.toggle('on',show);
}
function flagLock(){ LOCK_SHOWN=true; updateLock(); }
async function copyText(t,btn){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
            ta.select(); document.execCommand('copy'); ta.remove(); }
  if(btn){ const o=btn.textContent; btn.textContent='복사됨'; setTimeout(()=>btn.textContent=o,1200); }
}
function applyZoom(z){
  z=Math.max(.15,Math.min(1,z));
  $('cT').style.width=Math.round(528*z)+'px';
  $('cD').style.width=Math.round(860*z)+'px';
  $('zoomVal').value=Math.round(z*100)+'%';
  $('pvZoom').value=Math.round(z*100);
}
function fitZoom(){
  const avail=$('stage').clientWidth-56-20-64;   // 스테이지 여백 + 프레임 간격 + 프레임 안쪽 여백
  applyZoom(avail/(528+860));
}
$('pvZoom').addEventListener('input',()=>applyZoom(+$('pvZoom').value/100));
$('zoomFit').onclick=fitZoom;
window.addEventListener('resize',()=>{ if(window.__fitMode) fitZoom(); });
$('zoomFit').addEventListener('click',()=>{ window.__fitMode=true; });
$('pvZoom').addEventListener('input',()=>{ window.__fitMode=false; });

/* 버튼 상태를 항상 원래대로 되돌립니다 — 실패하든 성공하든 '저장 중…' 에 멈추지 않습니다 */
async function busy(btn,label,fn){
  if(btn.dataset.busy) return;
  btn.dataset.busy='1'; btn.disabled=true; btn.textContent='저장 중…';
  let done=false;
  try{ await fn(); done=true; }
  catch(e){ alert('저장에 실패했습니다.\n'+e.message); }
  finally{
    btn.textContent = done ? '저장됨' : label;
    setTimeout(()=>{ btn.textContent=label; btn.disabled=false; delete btn.dataset.busy; },1200);
  }
}

/* 메인타이틀 1행 이름으로 바로 저장 — 신규 건은 제품 목록을 거치지 않아도 됩니다 */
async function quickSave(silent){
  const nm=V('t1').trim();
  if(!nm){ if(!silent) alert('메인타이틀 1행을 먼저 입력해 주세요.'); return; }
  // 가격은 저장 조건이 아닙니다 — 이미지·문구만 먼저 저장해두고 나중에 채울 수 있습니다

  let prod=PRODUCTS.find(p=>p.name===nm);
  if(!prod){
    prod={id:newPid(),name:nm};
    PRODUCTS.push(prod); PRODUCTS.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    try{ await Store.setProducts(PRODUCTS); }
    catch(e){ alert('제품 등록에 실패했습니다.\n'+e.message); return; }
  }else if(!silent && SAVED.has(prod.id) &&
    !confirm('"'+nm+'" 기록이 이미 있습니다.\n덮어쓸까요?')) return;

  const btn=$('t1Save');
  if(missingAll().length) flagLock();   // 저장은 되지만 빠진 항목을 알려줍니다
  await busy(btn,'저장',async()=>{
    await Store.put({id:prod.id,name:nm,date:stamp(),ts:Date.now(),data:snapshot()});
    fillProducts(prod.id); $('histP1').value=prod.id;
    renderHist();                       // 목록 갱신은 버튼 상태와 분리합니다
  });
}
$('t1Save').onclick=quickSave;

/* ---------- 단계 이동 ---------- */
let STEP=1;
const STEP_TXT={
  1:['1. 제품 선택','히스토리에서 불러오거나, 새로 시작해주세요.'],
  2:['2. 썸네일','제품명은 메인타이틀 1행입니다.'],
  3:['3. 상세 · 옵션','옵션은 최대 3개까지 추가할 수 있습니다.']
};
function goStep(n){
  STEP=Math.max(1,Math.min(3,n));
  $('paneTitle').textContent=STEP_TXT[STEP][0];
  $('paneLead').textContent=STEP_TXT[STEP][1];
  document.querySelectorAll('.pane').forEach(el=>el.classList.toggle('on',+el.dataset.pane===STEP));
  document.querySelectorAll('.step').forEach(el=>{
    const s=+el.dataset.step;
    el.classList.toggle('on',s===STEP);
    el.classList.toggle('done',s<STEP);
  });
  $('prevStep').hidden = STEP===1;
  $('nextStep').hidden = STEP===3;
  syncNav();
  document.querySelector('.panebox').scrollTop=0;
}
document.querySelectorAll('.step').forEach(el=>el.onclick=()=>goStep(+el.dataset.step));

/* ---------- 좌우 폭 조절 ---------- */
(function(){
  const grip=$('grip'); let on=false;
  const move=e=>{
    if(!on) return;
    const x=(e.touches?e.touches[0].clientX:e.clientX)-26;
    const w=Math.max(340,Math.min(760,x));
    document.documentElement.style.setProperty('--panelw',w+'px');
    if(window.__fitMode) fitZoom();
    e.preventDefault();
  };
  const stop=()=>{ on=false; grip.classList.remove('on'); document.body.style.userSelect=''; };
  grip.addEventListener('mousedown',e=>{ on=true; grip.classList.add('on');
    document.body.style.userSelect='none'; e.preventDefault(); });
  grip.addEventListener('touchstart',e=>{ on=true; grip.classList.add('on'); },{passive:true});
  window.addEventListener('mousemove',move);
  window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',stop); window.addEventListener('touchend',stop);
  grip.addEventListener('dblclick',()=>{                 // 더블클릭하면 기본 폭
    document.documentElement.style.setProperty('--panelw','460px');
    if(window.__fitMode) fitZoom();
  });
})();
$('prevStep').onclick=()=>goStep(STEP-1);
$('nextStep').onclick=()=>goStep(STEP+1);
function openHist(on){
  $('histPanel').hidden=!on;
  $('histToggle').classList.toggle('on',on);
  if(on){ renderHist(); if(!$('histSearch').hidden) $('histSearch').focus(); }
}
$('histToggle').onclick=()=>openHist($('histPanel').hidden);
$('histSearch').addEventListener('input',()=>renderHist());
const stepZoom=d=>{                        // ＋ − 는 10% 단위로 딱 떨어지게
  const cur=+$('pvZoom').value;
  const next=(d>0 ? Math.floor(cur/10)+1 : Math.ceil(cur/10)-1)*10;
  window.__fitMode=false; applyZoom(next/100);
};
$('zoomIn').onclick=()=>stepZoom(1);
$('zoomOut').onclick=()=>stepZoom(-1);
function commitZoom(){
  const v=parseInt($('zoomVal').value.replace(/[^0-9]/g,''),10);
  window.__fitMode=false;
  applyZoom(isNaN(v)? +$('pvZoom').value/100 : v/100);
}
$('zoomVal').addEventListener('change',commitZoom);
$('zoomVal').addEventListener('keydown',e=>{ if(e.key==='Enter'){ commitZoom(); e.target.blur(); } });
$('zoomVal').addEventListener('focus',e=>e.target.select());

window.syncNav=syncNav;
function syncNav(){
  // 넘어갈 내용이나 저장할 내용이 있을 때만 초록으로 강조합니다
  const named = !!(V('t1').trim() && V('t1').trim()!==BASE_NAME);
  $('nextStep').classList.toggle('solid', STEP<3 && named);
  $('t1Save').classList.toggle('solid', named);
}
function draw(){ drawThumb(); drawDetail(); updateLock(); syncNav(); }
fillProducts();                         // 목록을 먼저 채운 뒤 저장소를 조회합니다
initCropDrag(); renderOpts(); draw(); goStep(1); window.__fitMode=true; fitZoom();
initProducts()
  .then(()=>{ applyProductPlaceholders(); return renderHist(); })
  .catch(e=>{ setConn('초기화 실패: '+e.message,true); fillProducts(); });
window.addEventListener('error',e=>setConn('오류: '+e.message,true));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
setTimeout(draw,900);
</script>
