<meta charset="utf-8">
<title>히든페이지 스튜디오</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --green:#2D4A3E; --green-deep:#1E332B; --yellow:#F6DE4A;
    --ink:#191F28; --sub:#4E5968; --mute:#B4BBC3;
    --line:#F2F4F6; --card:#F9FAFB; --chip:#F2F4F6; --paper:#FFFFFF;
    --r:14px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:14px;
    -webkit-font-smoothing:antialiased}
  .wrap{display:grid;grid-template-columns:432px 1fr;min-height:100vh}

  /* ---------- editor ---------- */
  .editor{background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;height:100vh;
    padding-bottom:28px}
  .brand{padding:26px 22px 18px}
  .brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em}
  .brand p{margin:6px 0 0;font-size:12.5px;color:var(--mute)}

  .sec{margin:0 18px 14px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:20px}
  .sec>h2,details.fold>summary{display:flex;align-items:center;gap:9px;margin:0 0 16px;
    font-size:14.5px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  .sec>h2 i,details.fold>summary i{font-style:normal;flex:0 0 auto;width:20px;height:20px;
    border-radius:6px;background:var(--chip);color:var(--sub);font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center}
  .sec>h2 span{font-weight:500;color:var(--mute);font-size:12px}

  details.fold>summary{cursor:pointer;list-style:none;margin:0}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::after{content:"▾";margin-left:auto;color:var(--mute);font-size:11px}
  details.fold[open]>summary::after{content:"▴"}
  details.fold[open]>summary{margin-bottom:16px}
  .foldbody{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

  label{display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin:0 0 6px}
  input[type=text],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid transparent;
    border-radius:10px;font-family:inherit;font-size:13.5px;background:#FFFFFF;color:var(--ink);
    box-shadow:0 0 0 1px var(--line) inset}
  input::placeholder{color:var(--mute)}
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 2px var(--green) inset}
  select:disabled{background:var(--chip);color:var(--mute)}
  .field{margin-bottom:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .inline{display:flex;gap:6px;align-items:center}
  .inline input,.inline select{flex:1;min-width:0}
  .subcard{background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}

  button{font-family:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);
    background:#FFFFFF;padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--sub);
    transition:.14s ease;white-space:nowrap}
  button:hover{border-color:var(--green);color:var(--green)}
  button.solid{background:var(--green);border-color:var(--green);color:#fff}
  button.solid:hover{background:var(--green-deep);color:#fff}
  button.mini{padding:9px 14px;flex:0 0 auto}
  button.wide{width:100%;padding:11px 15px}
  .prow{margin-top:10px}
  .prow.one{grid-template-columns:1fr}
  button.ghost{border-color:transparent;background:var(--chip);color:var(--mute)}
  button.ghost:hover{color:#DE4F3C;background:#FDECE9}
  button:disabled{opacity:.42;cursor:not-allowed}
  button:disabled:hover{border-color:var(--line);color:var(--sub)}

  .drop{border:1.5px dashed #E2E6EA;border-radius:12px;padding:22px 14px;text-align:center;
    cursor:pointer;font-size:12.5px;color:var(--mute);background:#FFFFFF}
  .drop:hover{border-color:var(--green);color:var(--green)}
  .drop.has{padding:8px;border-style:solid;border-color:var(--line);background:#fff}
  .drop.has img{display:block;width:auto;max-width:100%;height:150px;margin:0 auto;
    object-fit:contain;border-radius:8px}
  #cCrop{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);
    cursor:grab;background:var(--chip);touch-action:none}
  #cCrop:active{cursor:grabbing}
  #cropBox input[type=range]{width:100%;margin:12px 0 10px;accent-color:var(--green)}
  #dropLogo{background:var(--green);display:flex;align-items:center;justify-content:center;
    padding:16px;border:none;border-radius:12px;cursor:pointer}
  #dropLogo img{height:34px;width:auto;object-fit:contain}

  .opt{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;background:#FFFFFF}
  .opt header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .opt header b{font-size:12.5px;color:var(--ink);display:flex;align-items:center}
  .rate{display:inline-block;background:var(--green);color:#fff;border-radius:999px;
    padding:3px 10px;font-size:11px;font-weight:700;margin-left:7px}

  .hist{display:flex;align-items:center;justify-content:space-between;gap:8px;
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:8px;background:#FFFFFF}
  .hist b{display:block;font-size:12.5px;font-weight:700}
  .hist span{font-size:11px;color:var(--mute)}
  .hist .btns{display:flex;gap:4px;flex-shrink:0}
  .hist button{padding:7px 11px;font-size:11.5px}

  button.path{width:100%;margin-top:8px;background:var(--chip);border-color:transparent;
    font-size:11.5px;color:var(--sub);border-radius:10px;padding:9px 12px}
  button.path:hover{background:var(--green);color:#fff}
  .hint{font-size:11.5px;color:var(--mute);line-height:1.7;margin:8px 0 0}
  .lock{margin:0;padding:0 22px;font-size:11.5px;line-height:1.6;color:var(--mute)}
  .lock.on{color:#DE4F3C;padding-top:4px}
  .actions{display:flex;gap:8px;padding:14px 22px 0}
  .actions button{flex:1;padding:13px 15px;font-size:13.5px}

  /* ---------- preview ---------- */
  .stage{padding:26px 28px;overflow-y:auto;height:100vh;background:var(--paper)}
    .zoombar{display:flex;align-items:center;gap:12px;margin-bottom:18px;
    background:var(--chip);border-radius:999px;padding:8px 8px 8px 18px;width:max-content}
  .zoombar span{font-size:12px;font-weight:600;color:var(--sub)}
  .zoombar b{font-size:12px;font-weight:700;color:var(--ink);min-width:38px;text-align:right}
  .zoombar input[type=range]{width:160px;accent-color:var(--green)}
  .canvases{display:flex;gap:20px;align-items:flex-start;flex-wrap:nowrap;
    overflow-x:auto;padding-bottom:10px}
  .frame{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;
    flex:0 0 auto}
  .frame h3{margin:0 0 12px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mute)}
  .frame canvas{display:block;max-width:100%;height:auto;border-radius:4px;
    box-shadow:0 2px 14px rgba(25,31,40,.07)}
</style>

<div class="wrap">
<div class="editor">
  <div class="brand">
    <h1>히든페이지 스튜디오</h1>
    <p>썸네일 528×659 · 상세 860×가변 · 할인율 자동 계산</p>
  </div>

  <div class="sec">
    <details class="fold" id="histFold">
      <summary><i>1</i>히스토리</summary>
      <div class="foldbody">
        <div class="field"><label>히스토리 선택</label>
          <div class="inline"><select id="histP1"></select><button id="pEdit" class="mini">수정</button></div></div>

        <div id="pPanel" class="subcard" hidden>
          <div class="field"><label id="pLabel">제품명</label>
            <input type="text" id="pName" placeholder="제품명을 입력하세요"></div>
          <button id="pPrimary" class="wide">이름 변경</button>
          <div class="row prow" id="pRow2"><button id="pDel" class="ghost">목록에서 삭제</button>
            <button id="pCancel">취소</button></div>
          <p class="hint" id="pHint"></p>
        </div>

        <div class="row"><button id="histSave" class="solid">현재 설정 저장</button><button id="histNew">새로 시작</button></div>
        <p class="hint" id="histNote"></p>
        <p class="hint" id="connNote"></p>
        <p class="hint">같은 제품으로 저장하면 기존 기록을 덮어씁니다. 제품당 1건만 남습니다.</p>
      </div>
    </details>
  </div>

  <div class="sec">
    <h2><i>2</i>썸네일</h2>
    <div class="field"><label>메인타이틀 1행 (Bold 54) · 히스토리 제목</label>
      <div class="inline"><input type="text" id="t1" placeholder="더스트라 더스트 클리너">
        <button id="t1Save" class="mini" title="이 이름으로 히스토리에 저장">저장</button></div></div>
    <div class="field"><label>메인타이틀 2행 (Bold 54 · 브랜드 그린)</label>
      <input type="text" id="t2" placeholder="시크릿 특가"></div>
    <div class="field"><label>서브타이틀 앞부분 (Regular 22)</label>
      <input type="text" id="sub" placeholder="오직 여기서만, 더스트라 더스트 클리너"></div>
    <div class="field"><label>연출컷 528×400 · 드래그로 위치, 슬라이더로 확대</label>
      <div class="drop" id="dropThumb">클릭해서 이미지 선택</div>
      <div id="cropBox" hidden>
        <canvas id="cCrop" width="348" height="264"></canvas>
        <input type="range" id="zoom" min="100" max="280" value="100">
        <div class="row"><button id="cropReset">가운데 정렬</button><button id="cropChange">이미지 변경</button></div>
      </div>
      <button class="path" data-copypath="1">이미지 경로 복사</button></div>
    <p class="hint">서브타이틀 끝의 <b>UP TO 00%</b>는 옵션 중 최대 할인율로 자동 입력됩니다.</p>
  </div>

  <div class="sec">
    <h2><i>3</i>상세 · 옵션 <span id="optCount"></span></h2>
    <div id="opts"></div>
    <button id="addOpt">＋ 옵션 추가</button>
    <p class="hint">텍스트 칸은 비워두면 회색 예시값이 들어갑니다. <b>가격 3칸은 반드시 입력</b>해야 저장됩니다.</p>
  </div>

  <div class="sec">
    <details class="fold">
      <summary><i>4</i>상단 고정 안내 문구</summary>
      <div>
        <div class="field"><label>상단 라벨</label><input type="text" id="g0" placeholder="주의"></div>
        <div class="field"><label>헤드라인 1행</label><input type="text" id="g1" placeholder="이 페이지를 나가면"></div>
        <div class="field"><label>헤드라인 2행 (옐로우)</label><input type="text" id="g2" placeholder="할인이 불가능합니다."></div>
        <div class="field"><label>설명 1행</label><input type="text" id="g3" placeholder="비정상적가격 할인행사 시 재판매유통 피해를 막기 위해"></div>
        <div class="field"><label>설명 2행</label><input type="text" id="g4" placeholder="본 링크에서만 할인가 구매가 가능합니다."></div>
        <div class="field"><label>NOTICE 1행</label><input type="text" id="g5" placeholder="링크 저장 없이 페이지 이탈 시 재접속이 불가하오니 참고바랍니다."></div>
        <div class="field"><label>NOTICE 2행</label><input type="text" id="g6" placeholder="국내 및 해외 모든 판매처중 가장 압도적인 혜택이 적용되어 있습니다."></div>
        <div class="field"><label>브랜드 로고 이미지 (클릭해서 교체)</label>
          <div class="drop has" id="dropLogo"></div></div>
        <div class="row">
          <div class="field"><label>섹션 타이틀</label><input type="text" id="g8" placeholder="비밀링크 할인가 안내"></div>
          <div class="field"><label>섹션 설명</label><input type="text" id="g9" placeholder="이 페이지에서만 할인가로 구매할 수 있습니다."></div>
        </div>
      </div>
    </details>
  </div>

  <p class="lock" id="lockMsg"></p>
  <div class="actions">
    <button class="solid" id="dlBoth">JPG 2장 저장</button>
    <button id="dlThumb">썸네일만</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="zoombar">
    <span>미리보기</span>
    <input type="range" id="pvZoom" min="15" max="100" value="40">
    <b id="zoomVal">40%</b>
    <button id="zoomFit" class="mini">화면 맞춤</button>
  </div>
  <div class="canvases">
    <div class="frame" id="fT"><h3>THUMBNAIL 528 × 659</h3><canvas id="cT" width="528" height="659"></canvas></div>
    <div class="frame" id="fD"><h3>DETAIL 860 × <span id="dh">2440</span></h3><canvas id="cD" width="860" height="2440"></canvas></div>
  </div>
</div>
</div>

/* ---------- canvas helpers ---------- */
function f(size,weight){return `${weight} ${size}px Pretendard, sans-serif`;}
function txt(_,c,t,x0,y,{size=20,weight=400,color=INK,align='left',ls=0}={}){
  c.font=f(size,weight); c.fillStyle=color; c.textBaseline='middle';
  if(!ls){ c.textAlign=align; c.fillText(t,x0,y); c.textAlign='left'; return; }
  c.textAlign='left';
  const w=[...t].reduce((s,ch)=>s+c.measureText(ch).width+ls,0)-ls;
  let cx = align==='center'? x0-w/2 : align==='right'? x0-w : x0;
  for(const ch of t){ c.fillText(ch,cx,y); cx+=c.measureText(ch).width+ls; }
}
function width(c,t,size,weight,ls=0){
  c.font=f(size,weight);
  return ls? [...t].reduce((s,ch)=>s+c.measureText(ch).width+ls,0)-ls : c.measureText(t).width;
}
function drawCrop(c,img,X,Y,W,H,cr){
  if(!img){ c.fillStyle='#ECEFEE'; c.fillRect(X,Y,W,H);
    txt(0,c,'이미지 없음',X+W/2,Y+H/2,{size:16,color:'#A9B4B2',align:'center'}); return; }
  const s=Math.max(W/img.width,H/img.height)*cr.zoom, dw=img.width*s, dh=img.height*s;
  c.save(); c.beginPath(); c.rect(X,Y,W,H); c.clip();
  c.drawImage(img, X+(W-dw)*cr.x, Y+(H-dh)*cr.y, dw, dh); c.restore();
}
function cover(c,img,x,y,w,h){
  if(!img){ c.fillStyle='#ECEFEE'; c.fillRect(x,y,w,h);
    txt(0,c,'이미지 없음',x+w/2,y+h/2,{size:16,color:'#A9B4B2',align:'center'}); return; }
  const s=Math.max(w/img.width,h/img.height), dw=img.width*s, dh=img.height*s;
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh); c.restore();
}
function priceRow(c,y,label,value,{lc,vc,vs,vw,ls_=false}){
  txt(0,c,label,M,y,{size:22,weight:ls_?700:300,color:lc});
  const uw=width(c,'원',18,300);
  txt(0,c,'원',TEXT_R,y+4,{size:18,weight:300,color:lc,align:'right'});
  txt(0,c,won(value),TEXT_R-uw-4,y,{size:vs,weight:vw,color:vc,align:'right'});
}

}

function drawBlock(c,o,i,T){

  priceRow(c,T+289,'할인가',num(o.sale),{lc:'#333333',vc:'#333333',vs:28,vw:700});

  cover(c,o.img,IMG_X,T+10,IMG_W,IMG_H);
}

      <div class="field"><label>상품명 2행</label><input type="text" data-k="l2" data-i="${i}" value="${o.l2}" placeholder="${PH.l2}"></div>

        <div class="field"><label>할인가</label><input type="number" data-k="sale" data-i="${i}" value="${o.sale}" placeholder="${PH.sale}"></div>

function loadImg(file,cb){
  const r=new FileReader();
  r.onload=e=>{const im=new Image(); im.onload=()=>cb(im); im.src=e.target.result;};
  r.readAsDataURL(file);
}
function pick(cb){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>inp.files[0]&&loadImg(inp.files[0],cb); inp.click();
}
document.addEventListener('input',e=>{
  const i=e.target.dataset.i;
  if(i!==undefined){
    const k=e.target.dataset.k;
    opts[i][k]=e.target.value;
    if(['normal','secret'].includes(k)){
      const b=document.querySelectorAll('.opt .rate')[i]; if(b) b.textContent=rate(opts[i])+'%';
    }
  }
  draw();
});
document.addEventListener('click',e=>{
  if(e.target.dataset.copypath){ copyText(NAS_PATH,e.target); return; }
  const d=e.target.closest('[data-drop]');
  if(d){ const i=+d.dataset.drop;
    pick(im=>normalize(im,IMG_W,IMG_H,n=>{opts[i].img=n; renderOpts(); draw();})); return; }
  const del=e.target.dataset.del;
  if(del!==undefined){ opts.splice(+del,1); renderOpts(); draw(); }
});
$('addOpt').onclick=()=>{
  if(opts.length>=3) return;
  opts.push(blank());
  renderOpts(); draw();
};
$('dropLogo').onclick=()=>pick(im=>{ logoImg=im;
  $('dropLogo').innerHTML='<img src="'+im.src+'">'; draw(); });
$('dropThumb').onclick=pickThumb;

/* ---------- 이미지 정규화: 슬롯 규격 2배로 미리 크롭·압축 ---------- */
function normalize(img,w,h,cb){
  const s=2, cv=document.createElement('canvas'); cv.width=w*s; cv.height=h*s;
  const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height);
  cover(c,img,0,0,cv.width,cv.height);
  const out=new Image(); out.onload=()=>cb(out); out.src=cv.toDataURL('image/jpeg',0.9);
}
function downscale(img,max,cb){
  const s=Math.min(1,max/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');
  cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  const out=new Image(); out.onload=()=>cb(out); out.src=cv.toDataURL('image/jpeg',0.92);
}
function setThumbPreview(){
  const has=!!thumbImg;
  $('dropThumb').hidden=has; $('cropBox').hidden=!has;
  $('zoom').value=Math.round(thumbCrop.zoom*100);
  drawCropPreview();
}
function drawCropPreview(){
  const cv=$('cCrop'), c=cv.getContext('2d'), k=cv.width/528;
  c.clearRect(0,0,cv.width,cv.height);
  c.save(); c.scale(k,k); drawCrop(c,thumbImg,0,0,528,400,thumbCrop); c.restore();
}
function pickThumb(){   // 연출컷 원본은 긴 변 1800px 로 줄여 보관
  pick(im=>downscale(im,1800,n=>{ thumbImg=n; thumbCrop={zoom:1,x:.5,y:.5}; setThumbPreview(); draw(); }));
}
/* 드래그로 위치 조절 */
function initCropDrag(){
  const cv=$('cCrop'); let drag=null;
  const pt=e=>e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};
  const start=e=>{ if(thumbImg){ drag=pt(e); e.preventDefault(); } };
  const move=e=>{
    if(!drag||!thumbImg) return;
    const p=pt(e), k=cv.width/528;
    const s=Math.max(528/thumbImg.width,400/thumbImg.height)*thumbCrop.zoom;
    const ovX=thumbImg.width*s-528, ovY=thumbImg.height*s-400;
    const cl=v=>Math.min(1,Math.max(0,v));
    if(ovX>0.5) thumbCrop.x=cl(thumbCrop.x-(p.x-drag.x)/k/ovX);
    if(ovY>0.5) thumbCrop.y=cl(thumbCrop.y-(p.y-drag.y)/k/ovY);
    drag=p; drawCropPreview(); drawThumb(); e.preventDefault();
  };
  const end=()=>{ drag=null; };
  cv.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false});
  cv.addEventListener('touchmove',move,{passive:false});
  cv.addEventListener('touchend',end);
  $('zoom').addEventListener('input',()=>{ thumbCrop.zoom=+$('zoom').value/100; drawCropPreview(); drawThumb(); });
  $('cropReset').onclick=()=>{ thumbCrop={zoom:1,x:.5,y:.5}; setThumbPreview(); draw(); };
  $('cropChange').onclick=pickThumb;
}

const API_URL   = 'https://script.google.com/macros/s/AKfycbydgdu1_uasQmLhhO6TV_TP995LqDypYE2DKgDXp-CV9p4Bts7vAaTVcb4AeMTMhs-R/exec';                      // 4단계에서 발급받은 /exec URL 을 여기에

/* 업로드한 이미지의 data URL ↔ 드라이브 파일ID 대응.
   불러온 뒤 그대로 저장하면 재업로드 없이 기존 파일을 재사용합니다. */
const IMG_ID=new Map();

/* 드라이브 이미지 캐시 (IndexedDB) — 두 번째 불러오기부터는 서버를 거치지 않습니다 */
const Cache=(()=>{
  let db=null;
  const open=()=>new Promise(res=>{
    if(db) return res(db);
    try{
      const r=indexedDB.open('hps-img',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('img');
      r.onsuccess=()=>{ db=r.result; res(db); };
      r.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
  const tx=async(mode,fn)=>{
    const d=await open(); if(!d) return null;
    return new Promise(res=>{
      const t=d.transaction('img',mode), s=t.objectStore('img'), q=fn(s);
      q.onsuccess=()=>res(q.result); q.onerror=()=>res(null);
    });
  };
  return {
    get:id=>tx('readonly',s=>s.get(id)),
    set:(id,v)=>tx('readwrite',s=>s.put(v,id))
  };
})();

async function api(payload){
  const ac=new AbortController();
  const timer=setTimeout(()=>ac.abort(),45000);          // 응답이 없으면 45초 뒤 중단
  let r;
  try{
    r=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // 사전요청(OPTIONS) 회피
      body:JSON.stringify(Object.assign({token:API_TOKEN},payload)),
      signal:ac.signal
    });
  }catch(e){
    throw new Error(e.name==='AbortError' ? '서버 응답이 없습니다 (시간 초과)' : e.message);
  }finally{ clearTimeout(timer); }
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'API_ERROR');
  return j;
}

/* data URL → 드라이브 파일ID (이미 올린 이미지는 건너뜀) */
async function toFileId(dataUrl,label){
  if(!dataUrl) return null;
  if(IMG_ID.has(dataUrl)) return IMG_ID.get(dataUrl);
  const {id}=await api({action:'upload',name:label,data:dataUrl});
  IMG_ID.set(dataUrl,id);
  return id;
}
/* 드라이브 파일ID → data URL (캐시 우선) */
async function toDataUrl(id){
  if(!id) return null;
  const hit=await Cache.get(id);
  if(hit){ IMG_ID.set(hit,id); return hit; }
  const {data}=await api({action:'image',id});
  await Cache.set(id,data);
  IMG_ID.set(data,id);
  return data;
}

const Store = {
  mode: API_URL ? 'sheet' : (LS ? 'local' : 'memory'),

  /* --- 목록(가벼운 메타) --- */
  async list(){
    if(this.mode==='sheet') return (await api({action:'list'})).rows;
    if(!LS) return MEM.map(x=>({id:x.id,name:x.name,date:x.date,ts:x.ts}));
    return this._all().map(x=>({id:x.id,name:x.name,date:x.date,ts:x.ts}));
  },

  /* --- 제품 1건 전체 --- */
  async get(id){
    if(this.mode!=='sheet') return this._all().find(x=>x.id===id)||null;
    const {row}=await api({action:'get',productId:id});
    if(!row) return null;
    const data=JSON.parse(row.payload||'{}');
    if(data.thumb) data.thumb=await toDataUrl(data.thumb);
    for(const o of (data.opts||[])) if(o.img) o.img=await toDataUrl(o.img);
    return {id:row.id,name:row.name,date:row.date,ts:Date.parse(row.date.replace(/\./g,'-'))||0,data};
  },

  /* --- 저장 --- */
  async put(item){
    if(this.mode!=='sheet'){
      const list=this._all(), i=list.findIndex(x=>x.id===item.id);
      if(i>=0) list[i]=item; else list.push(item);
      return this._write(list);
    }
    const d=JSON.parse(JSON.stringify(item.data)), ids=[];
    if(d.thumb){ d.thumb=await toFileId(d.thumb,item.name+'_thumb'); ids.push(d.thumb); }
    for(let i=0;i<(d.opts||[]).length;i++){
      if(d.opts[i].img){ d.opts[i].img=await toFileId(d.opts[i].img,item.name+'_opt'+(i+1)); ids.push(d.opts[i].img); }
    }
    await api({action:'save',productId:item.id,productName:item.name,
               payload:JSON.stringify(d),images:ids,user:item.user||''});
    return true;
  },

  async del(id){
    if(this.mode==='sheet'){ await api({action:'delete',productId:id}); return true; }
    return this._write(this._all().filter(x=>x.id!==id));
  },

  /* --- 제품 목록 --- */
  async getProducts(){
    if(this.mode==='sheet'){
      const {products}=await api({action:'products'});
      return products.length?products:null;
    }
    if(!LS) return MEMP;
    try{ return JSON.parse(LS.getItem(PKEY)); }catch(e){ return null; }
  },
  async setProducts(list){
    if(this.mode==='sheet'){ await api({action:'saveProducts',products:list}); return; }
    if(!LS){ MEMP=list; return; }
    try{ LS.setItem(PKEY,JSON.stringify(list)); }catch(e){}
  },

  /* --- 로컬 전용 --- */
  _all(){
    if(!LS) return MEM;
    try{ return JSON.parse(LS.getItem(HKEY))||[]; }catch(e){ return []; }
  },
  _write(list){
    if(!LS){ MEM=list; return true; }
    for(let i=0;i<8;i++){
      try{ LS.setItem(HKEY,JSON.stringify(list)); return true; }
      catch(e){ if(list.length>1) list.shift(); else return false; }
    }
    return false;
  }
};

function ago(ts){
  if(!ts) return '시각 미상';
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return '방금 전';
  if(m<60) return m+'분 전';
  const hr=Math.floor(m/60);
  if(hr<24) return hr+'시간 전';
  const d=Math.floor(hr/24);
  return d<30 ? d+'일 전' : Math.floor(d/30)+'개월 전';
}
function stamp(){ const d=new Date(), z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'.'+z(d.getMonth()+1)+'.'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes()); }

function snapshot(){
  const s={fields:{},opts:[],thumb:thumbImg?thumbImg.src:null,crop:Object.assign({},thumbCrop),
           logo:(logoImg&&logoImg.src!==LOGO_SRC)?logoImg.src:null};
  GIDS.forEach(id=>s.fields[id]=$(id).value);
  s.opts=opts.map(o=>({name:o.name,tag:o.tag,l1:o.l1,l2:o.l2,
                       normal:o.normal,sale:o.sale,secret:o.secret,img:o.img?o.img.src:null}));
  return s;
}
function restore(s){
  GIDS.forEach(id=>{ if(s.fields&&s.fields[id]!==undefined) $(id).value=s.fields[id]; });
  opts=(s.opts||[blank()]).map(o=>{
    const n=Object.assign(blank(),o); n.img=null;
    if(o.img){ const im=new Image(); im.onload=draw; im.src=o.img; n.img=im; }
    return n;
  });
  thumbCrop = s.crop ? Object.assign({zoom:1,x:.5,y:.5},s.crop) : {zoom:1,x:.5,y:.5};
  if(s.thumb){ const im=new Image(); im.onload=()=>{thumbImg=im; setThumbPreview(); draw();}; im.src=s.thumb; }
  else { thumbImg=null; setThumbPreview(); }
  if(s.logo){ const im=new Image(); im.onload=()=>{logoImg=im; $('dropLogo').innerHTML='<img src="'+im.src+'">'; draw();}; im.src=s.logo; }
  renderOpts(); draw();
}

async function initProducts(){
  setConn(Store.mode==='sheet' ? '구글시트에 연결 중…' : '이 브라우저에만 저장됩니다 (시트 미연결)');
  let saved=null;
  try{
    saved=await Store.getProducts();
    if(Store.mode==='sheet') setConn('구글시트 연결됨 · 팀원과 기록이 공유됩니다');
  }catch(e){
    setConn('시트 연결 실패: '+e.message+' — 가이드의 문제 해결을 확인하세요',true);
  }
  if(Array.isArray(saved)&&saved.length){
    PRODUCTS=saved.map(x=> typeof x==='string' ? {id:newPid(),name:x} : x);
  }else{
    try{ await Store.setProducts(PRODUCTS); }catch(e){}   // 최초 1회만 기본 목록을 심습니다
  }
  fillProducts();

  let pMode='edit', pOrigin='';
  function syncPrimary(){
    const v=$('pName').value.trim();
    const changed = pMode==='add' ? !!v : (!!v && v!==pOrigin);
    $('pPrimary').classList.toggle('solid',changed);
  }
  function openPanel(mode){
    pMode=mode; $('pPanel').hidden=false;
    const add = mode==='add';
    pOrigin = add ? '' : curName();
    $('pPrimary').textContent = add ? '제품 추가' : '이름 변경';
    $('pDel').hidden = add; $('pRow2').classList.toggle('one',add);
    $('pLabel').textContent = add ? '추가할 제품명' : '제품명';
    $('pHint').textContent = add ? '단품·세트 구성 모두 이름으로 구분해 등록하세요.'
                                 : '이름을 바꾸면 저장된 기록의 이름도 함께 바뀝니다.';
    $('pName').value = pOrigin; syncPrimary(); $('pName').focus();
  }
  function closePanel(){ $('pPanel').hidden=true; }

  $('pName').addEventListener('input',syncPrimary);
  $('pPrimary').onclick=()=>{ pMode==='add' ? doAdd() : doRename(); };
  $('pCancel').onclick=closePanel;
  $('pEdit').onclick=()=>{
    if($('pPanel').hidden===false){ closePanel(); return; }
    if(!curId()){ alert('수정할 제품을 먼저 선택해 주세요.'); return; }
    openPanel('edit');
  };
  $('histP1').addEventListener('change',()=>{
    if($('histP1').value==='__add__'){ $('histP1').value=''; openPanel('add'); return; }
    closePanel();                       // 제품을 고르는 것만으로는 패널이 열리지 않습니다
    applyProductPlaceholders();
    loadSaved(curId());
  });

  async function doRename(){
    const id=curId(), oldN=curName(), newN=$('pName').value.trim();
    if(!id){ alert('바꿀 제품을 먼저 선택해 주세요.'); return; }
    if(!newN || newN===oldN) return;
    if(PRODUCTS.some(p=>p.name===newN)){ alert('같은 이름의 제품이 이미 있습니다.'); return; }
    PRODUCTS.find(p=>p.id===id).name=newN;   // 연결 키는 제품ID 라 이름을 바꿔도 기록이 유지됩니다

    fillProducts(id); closePanel(); applyProductPlaceholders(); renderHist();

  async function doAdd(){
    const n=$('pName').value.trim();
    if(!n){ alert('추가할 제품명을 입력해 주세요.'); return; }
    if(PRODUCTS.some(p=>p.name===n)){ alert('이미 목록에 있습니다.'); return; }
    const np={id:newPid(),name:n};
    PRODUCTS.push(np); PRODUCTS.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    try{ await Store.setProducts(PRODUCTS); }
    catch(e){ alert('제품 추가에 실패했습니다.\n'+e.message); return; }
    fillProducts(np.id); $('histP1').value=np.id;
    closePanel(); applyProductPlaceholders(); resetWork(); renderHist();
  }

    const id=curId(), n=curName();

    catch(e){ alert('삭제에 실패했습니다.\n'+e.message); return; }
    fillProducts(); $('pName').value=''; closePanel();
    resetWork(); applyProductPlaceholders(); renderHist();
  };
}

  $('zoomVal').textContent=Math.round(z*100)+'%';
  $('pvZoom').value=Math.round(z*100);
}
function fitZoom(){
  const avail=$('stage').clientWidth-56-20-64;   // 스테이지 여백 + 프레임 간격 + 프레임 안쪽 여백
  applyZoom(avail/(528+860));
}
$('pvZoom').addEventListener('input',()=>applyZoom(+$('pvZoom').value/100));
$('zoomFit').onclick=fitZoom;
window.addEventListener('resize',()=>{ if(window.__fitMode) fitZoom(); });
$('zoomFit').addEventListener('click',()=>{ window.__fitMode=true; });
$('pvZoom').addEventListener('input',()=>{ window.__fitMode=false; });

/* 버튼 상태를 항상 원래대로 되돌립니다 — 실패하든 성공하든 '저장 중…' 에 멈추지 않습니다 */
async function busy(btn,label,fn){
  if(btn.dataset.busy) return;
  btn.dataset.busy='1'; btn.disabled=true; btn.textContent='저장 중…';
  let done=false;
  try{ await fn(); done=true; }
  catch(e){ alert('저장에 실패했습니다.\n'+e.message); }
  finally{
    btn.textContent = done ? '저장됨' : label;
    setTimeout(()=>{ btn.textContent=label; btn.disabled=false; delete btn.dataset.busy; },1200);
  }
}

/* 메인타이틀 1행 이름으로 바로 저장 — 신규 건은 제품 목록을 거치지 않아도 됩니다 */
async function quickSave(){
  const nm=V('t1').trim();
  if(!nm){ alert('메인타이틀 1행을 먼저 입력해 주세요.'); return; }
  // 가격은 저장 조건이 아닙니다 — 이미지·문구만 먼저 저장해두고 나중에 채울 수 있습니다

  let prod=PRODUCTS.find(p=>p.name===nm);
  if(!prod){
    prod={id:newPid(),name:nm};
    PRODUCTS.push(prod); PRODUCTS.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    try{ await Store.setProducts(PRODUCTS); }
    catch(e){ alert('제품 등록에 실패했습니다.\n'+e.message); return; }
  }else if(SAVED.has(prod.id) &&
    !confirm('"'+nm+'" 기록이 이미 있습니다.\n덮어쓸까요?')) return;

  const btn=$('t1Save');
  await busy(btn,'저장',async()=>{
    await Store.put({id:prod.id,name:nm,date:stamp(),ts:Date.now(),data:snapshot()});
    fillProducts(prod.id); $('histP1').value=prod.id;
    renderHist();                       // 목록 갱신은 버튼 상태와 분리합니다
  });
}
$('t1Save').onclick=quickSave;

function draw(){ drawThumb(); drawDetail(); updateLock(); }
fillProducts();                         // 목록을 먼저 채운 뒤 저장소를 조회합니다
initCropDrag(); renderOpts(); draw(); window.__fitMode=true; fitZoom();
initProducts()
  .then(()=>{ applyProductPlaceholders(); return renderHist(); })
  .catch(e=>{ setConn('초기화 실패: '+e.message,true); fillProducts(); });
window.addEventListener('error',e=>setConn('오류: '+e.message,true));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
setTimeout(draw,900);
</script>
